[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]